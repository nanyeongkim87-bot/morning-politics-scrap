name: Collect morning politics articles

on:
  schedule:
    # 05:30 Asia/Seoul, Monday-Saturday (GitHub cron uses UTC).
    - cron: '30 20 * * 0-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morning-politics-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect and validate today's articles
        env:
          PYTHON: python
          REQUIRE_TODAY: '1'
          EXTERNAL_STATIC: '1'
        run: pnpm run build

      - name: Verify today's static build
        run: pnpm run verify:static

      - name: Save the new daily archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scraps.json
          git diff --cached --quiet || git commit -m "Update morning politics data"
          git push
