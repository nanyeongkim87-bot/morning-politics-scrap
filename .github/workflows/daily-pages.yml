name: Publish morning politics site

on:
  schedule:
    # 05:40 Asia/Seoul, Monday-Saturday (GitHub cron uses UTC).
    - cron: '40 20 * * 0-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: morning-politics-production
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build today's saved articles
        env:
          REQUIRE_TODAY: '1'
          EXTERNAL_STATIC: '1'
          SKIP_SCRAPE: '1'
        run: pnpm run build

      - name: Verify today's deployment artifact
        run: pnpm run verify:static

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy publicly
        id: deployment
        uses: actions/deploy-pages@v4
