name: Collect and publish morning politics site

on:
  push:
    branches:
      - main
    paths:
      - 'src/scraps.json'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.js'
      - 'index.html'
      - '.github/workflows/daily-pages.yml'
  schedule:
    # Independent chances between 05:15 and 08:07 Asia/Seoul, Monday-Saturday.
    # GitHub can delay or drop individual scheduled events, so later runs are catch-ups.
    - cron: '15,35,55 20 * * 0-5'
    - cron: '15,35 21 * * 0-5'
    - cron: '7 22 * * 0-5'
    - cron: '7 23 * * 0-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: morning-politics-unattended-production
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect and build today's articles
        env:
          PYTHON: python
          REQUIRE_TODAY: '1'
          EXTERNAL_STATIC: '1'
        run: |
          TODAY="$(node -e "const f=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}); process.stdout.write(f.format(new Date()).replaceAll('-',''))")"
          if node -e "const a=require('./src/scraps.json'); process.exit(a[process.argv[1]] ? 0 : 1)" "$TODAY"; then
            export SKIP_SCRAPE=1
            echo "Today's archive already exists; reusing it for deployment recovery."
          fi

          for attempt in 1 2 3; do
            if pnpm run build; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Attempt $attempt failed; retrying in 120 seconds."
            sleep 120
          done

      - name: Verify today's deployment artifact
        run: pnpm run verify:static

      - name: Save the new daily archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scraps.json
          git diff --cached --quiet || git commit -m "Update morning politics data"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy publicly
        id: deployment
        uses: actions/deploy-pages@v4
