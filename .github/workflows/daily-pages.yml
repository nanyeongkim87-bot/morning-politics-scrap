name: Collect and publish morning politics site

on:
  push:
    branches:
      - main
    paths:
      - 'src/scraps.json'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.js'
      - 'index.html'
      - '.github/workflows/daily-pages.yml'
  schedule:
    # Five chances between 05:07 and 06:27 Asia/Seoul, Monday-Saturday.
    # All attempts precede the user's 06:40 reading deadline.
    - cron: '7,27,47 20 * * 0-5'
    - cron: '7,27 21 * * 0-5'
    # Saturday 08:02 Asia/Seoul: refresh the partial close with any later papers.
    - cron: '2 23 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: morning-politics-unattended-production
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect and build today's articles
        env:
          PYTHON: python
          REQUIRE_TODAY: '1'
          EXTERNAL_STATIC: '1'
        run: |
          TODAY="$(node -e "const f=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}); process.stdout.write(f.format(new Date()).replaceAll('-',''))")"
          SEOUL_WEEKDAY="$(node -e "process.stdout.write(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',weekday:'short'}).format(new Date()))")"
          SEOUL_HHMM="$(node -e "const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(x=>[x.type,x.value])); process.stdout.write(p.hour+p.minute)")"
          if [ "$SEOUL_WEEKDAY" = "Sat" ] && [ "$SEOUL_HHMM" -ge 0625 ]; then
            export ALLOW_PARTIAL_SATURDAY=1
            echo "Saturday partial-source close is allowed after 06:25 KST."
          fi

          FORCE_REFRESH=0
          if [ "${{ github.event.schedule }}" = "2 23 * * 5" ]; then
            FORCE_REFRESH=1
            echo "Running the Saturday 08:02 additional close."
          fi

          if [ "$FORCE_REFRESH" -eq 0 ] && node -e "const a=require('./src/scraps.json'); process.exit(a[process.argv[1]] ? 0 : 1)" "$TODAY"; then
            export SKIP_SCRAPE=1
            echo "Today's archive already exists; reusing it for deployment recovery."
          fi

          for attempt in 1 2 3; do
            if pnpm run build; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Attempt $attempt failed; retrying in 120 seconds."
            sleep 120
          done

      - name: Verify today's deployment artifact
        run: pnpm run verify:static

      - name: Save the new daily archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scraps.json
          git diff --cached --quiet || git commit -m "Update morning politics data"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy publicly
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live page and record scheduler health
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-daily-health.js --require-live --wait-seconds 90
